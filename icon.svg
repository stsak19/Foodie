<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="foodie">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232E3B"/>
      <stop offset="1" stop-color="#141B23"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <!-- ring: the day's target, with a gap at the top right -->
  <circle cx="256" cy="256" r="146" fill="none" stroke="#2C3846" stroke-width="30"/>
  <path d="M256 110 a146 146 0 1 0 103.2 42.8"
        fill="none" stroke="#F2EDE4" stroke-width="30" stroke-linecap="round"/>
  <!-- the filled part of the ring -->
  <path d="M256 110 a146 146 0 0 1 103.2 42.8"
        fill="none" stroke="#D9A863" stroke-width="30" stroke-linecap="round"/>

  <!-- fork -->
  <g fill="#F2EDE4">
    <rect x="198" y="168" width="17" height="86" rx="8.5"/>
    <rect x="231" y="168" width="17" height="86" rx="8.5"/>
    <rect x="264" y="168" width="17" height="86" rx="8.5"/>
    <path d="M190 246 h99 a10 10 0 0 1 10 10 v10 a49 49 0 0 1-40 48.2 v39.8
             a8 8 0 0 1-8 8 h-23 a8 8 0 0 1-8-8 v-39.8
             a49 49 0 0 1-40-48.2 v-10 a10 10 0 0 1 10-10 z"/>
  </g>

  <!-- spoon -->
  <g fill="#D9A863">
    <ellipse cx="330" cy="214" rx="33" ry="46"/>
    <rect x="320" y="252" width="20" height="110" rx="10"/>
  </g>
</svg>
